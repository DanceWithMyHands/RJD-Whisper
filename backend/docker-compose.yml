services:
  db:
    image: postgres:15-alpine
    container_name: rzd_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rzd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rzd_password}
      POSTGRES_DB: ${POSTGRES_DB:-rzd_protocol}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rzd} -d ${POSTGRES_DB:-rzd_protocol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rzd_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: rzd_backend
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-rzd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rzd_password}
      POSTGRES_DB: ${POSTGRES_DB:-rzd_protocol}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-rzd-recordings}
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_super_secret_key_min_32_characters_long}
      SEED_ON_START: ${SEED_ON_START:-true}
      ASR_PROVIDER: ${ASR_PROVIDER:-stub}
      ASR_API_BASE_URL: ${ASR_API_BASE_URL:-https://api.groq.com/openai/v1}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_MODEL: ${ASR_MODEL:-whisper-large-v3}
      ASR_LANGUAGE: ${ASR_LANGUAGE:-ru}
      NIM_BASE_URL: ${NIM_BASE_URL:-}
      NIM_API_KEY: ${NIM_API_KEY:-}
    ports:
      - "8000:8000"

volumes:
  pg_data:
  minio_data:
